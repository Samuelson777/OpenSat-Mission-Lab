<!doctype html><html><head><meta charset='utf-8'><title>OpenSat v2.7</title>
<style>body{font-family:Arial;background:#0b1220;color:#e8eef8;margin:0}main{max-width:1180px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{background:#172238;border:1px solid #30415f;border-radius:12px;padding:16px}.pass{color:#70e1a1}.fail{color:#ff7b7b}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #30415f;text-align:left}img{width:100%;border-radius:10px;background:white}</style></head><body><main>
<h1>OpenSat Mission Lab v2.7</h1><p>Distributed tracing, adaptive autoscaling, capacity forecasting, and game-day validation.</p>
<div id='cards' class='grid'></div><h2>Validation</h2><table><thead><tr><th>ID</th><th>Status</th><th>Evidence</th></tr></thead><tbody id='checks'></tbody></table>
<h2>Evidence</h2><div class='grid'><div class='card'><img src='distributed_trace_timeline.png'></div><div class='card'><img src='autoscaling_response.png'></div><div class='card'><img src='capacity_forecast.png'></div><div class='card'><img src='game_day_timeline.png'></div></div>
<script>const d={"summary": {"version": "2.7.0", "status": "PASS", "checks_passed": 16, "checks_total": 16, "trace_count": 40, "span_count": 200, "complete_trace_count": 40, "sensitive_attribute_leaks": 0, "peak_workers": 12, "peak_queue_depth": 25, "final_queue_depth": 0, "scaling_decision_count": 6, "forecast_nmae_percent": 31.791102643737272, "game_day_count": 4, "game_days_passed": 4, "final_health": "HEALTHY"}, "checks": [{"check_id": "OTEL-001", "status": "PASS", "evidence": "Every job has a complete five-service trace"}, {"check_id": "OTEL-002", "status": "PASS", "evidence": "All span parents resolve"}, {"check_id": "OTEL-003", "status": "PASS", "evidence": "Sensitive values are redacted"}, {"check_id": "OTEL-004", "status": "PASS", "evidence": "Trace identifiers follow W3C lengths"}, {"check_id": "AUTO-001", "status": "PASS", "evidence": "Autoscaler performs scale-up"}, {"check_id": "AUTO-002", "status": "PASS", "evidence": "Autoscaler performs controlled scale-down"}, {"check_id": "AUTO-003", "status": "PASS", "evidence": "Backlog remains bounded"}, {"check_id": "AUTO-004", "status": "PASS", "evidence": "Final queue drains to zero"}, {"check_id": "AUTO-005", "status": "PASS", "evidence": "Cooldown prevents rapid oscillation"}, {"check_id": "CAP-001", "status": "PASS", "evidence": "Forecast error remains within demonstration guardrail"}, {"check_id": "CAP-002", "status": "PASS", "evidence": "Worker count respects configured maximum"}, {"check_id": "GAME-001", "status": "PASS", "evidence": "Every game-day experiment recovers"}, {"check_id": "GAME-002", "status": "PASS", "evidence": "Exporter outage activates local spool"}, {"check_id": "GAME-003", "status": "PASS", "evidence": "Worker crash is represented and recovered"}, {"check_id": "OPS-001", "status": "PASS", "evidence": "Scaling decision timeline is ordered"}, {"check_id": "OPS-002", "status": "PASS", "evidence": "Final platform state is healthy"}]}; const fields=[['Status',d.summary.status],['Checks',d.summary.checks_passed+' / '+d.summary.checks_total],['Traces',d.summary.trace_count],['Peak workers',d.summary.peak_workers],['Peak queue',d.summary.peak_queue_depth],['Forecast NMAE',d.summary.forecast_nmae_percent.toFixed(2)+'%'],['Game days',d.summary.game_day_count],['Final queue',d.summary.final_queue_depth]];document.getElementById('cards').innerHTML=fields.map(x=>`<div class='card'><b>${x[0]}</b><h2>${x[1]}</h2></div>`).join('');document.getElementById('checks').innerHTML=d.checks.map(x=>`<tr><td>${x.check_id}</td><td class='${x.status.toLowerCase()}'>${x.status}</td><td>${x.evidence}</td></tr>`).join('');</script></main></body></html>
