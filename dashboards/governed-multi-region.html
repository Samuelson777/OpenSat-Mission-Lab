<!doctype html><html><head><meta charset='utf-8'><title>OpenSat v2.9</title>
<style>body{font-family:Arial;background:#0b1220;color:#edf3ff;margin:0}main{max-width:1180px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#172238;border:1px solid #31445f;border-radius:12px;padding:16px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #31445f;text-align:left}.pass{color:#70e1a1}.fail{color:#ff7b7b}img{width:100%;border-radius:10px;background:white}</style></head><body><main>
<h1>OpenSat Mission Lab v2.9</h1><p>Consistency governance, conflict resolution, fair rate limiting, data sovereignty, and audited failover decisions.</p>
<div class='grid' id='cards'></div><h2>Validation</h2><table><thead><tr><th>ID</th><th>Status</th><th>Evidence</th></tr></thead><tbody id='checks'></tbody></table>
<h2>Evidence</h2><div class='grid'><div class='card'><img src='consistency_staleness.png'></div><div class='card'><img src='conflict_resolution.png'></div><div class='card'><img src='rate_limit_fairness.png'></div><div class='card'><img src='sovereignty_compliance.png'></div></div>
<script>const d={"summary": {"version": "2.9.0", "status": "PASS", "checks_passed": 20, "checks_total": 20, "admitted_requests": 1875, "throttled_requests": 231, "deferred_sovereign_requests": 49, "sovereignty_violations": 0, "bounded_stale_reads_blocked": 6, "conflict_count": 4, "manual_review_conflicts": 1, "audit_entry_count": 119, "minimum_jain_fairness": 0.9976275207591934, "acknowledged_record_loss": 0, "final_state": "HEALTHY"}, "checks": [{"check_id": "CONS-001", "status": "PASS", "evidence": "Strong writes retain a majority quorum"}, {"check_id": "CONS-002", "status": "PASS", "evidence": "Stale bounded reads are blocked during partition"}, {"check_id": "CONS-003", "status": "PASS", "evidence": "Every served bounded read meets the five-second budget"}, {"check_id": "CONS-004", "status": "PASS", "evidence": "Eventual writes remain available during partition"}, {"check_id": "CONFLICT-001", "status": "PASS", "evidence": "Four deterministic conflict classes are exercised"}, {"check_id": "CONFLICT-002", "status": "PASS", "evidence": "Conflict handling reports no data loss"}, {"check_id": "CONFLICT-003", "status": "PASS", "evidence": "Unsafe command conflict is quarantined for manual review"}, {"check_id": "RATE-001", "status": "PASS", "evidence": "Tenant quotas are enforced"}, {"check_id": "RATE-002", "status": "PASS", "evidence": "Global rate limit is never exceeded"}, {"check_id": "RATE-003", "status": "PASS", "evidence": "Jain fairness stays above 0.94"}, {"check_id": "RATE-004", "status": "PASS", "evidence": "Burst traffic produces explicit throttling evidence"}, {"check_id": "SOV-001", "status": "PASS", "evidence": "Every routed or deferred request preserves residency"}, {"check_id": "SOV-002", "status": "PASS", "evidence": "EU restricted data stays in Frankfurt"}, {"check_id": "SOV-003", "status": "PASS", "evidence": "India restricted data stays in Bengaluru or is deferred"}, {"check_id": "SOV-004", "status": "PASS", "evidence": "Regional outage produces sovereignty-safe deferred work"}, {"check_id": "FAIL-001", "status": "PASS", "evidence": "All failover policy decisions pass"}, {"check_id": "FAIL-002", "status": "PASS", "evidence": "Failover decisions report zero acknowledged-record loss"}, {"check_id": "AUDIT-001", "status": "PASS", "evidence": "Decision audit chain verifies"}, {"check_id": "AUDIT-002", "status": "PASS", "evidence": "Audit entries have unique hashes"}, {"check_id": "FINAL-001", "status": "PASS", "evidence": "Restricted India workload is visibly deferred during outage"}]};const fields=[['Status',d.summary.status],['Checks',d.summary.checks_passed+' / '+d.summary.checks_total],['Requests admitted',d.summary.admitted_requests],['Requests throttled',d.summary.throttled_requests],['Deferred sovereign work',d.summary.deferred_sovereign_requests],['Conflicts',d.summary.conflict_count],['Audit entries',d.summary.audit_entry_count],['Residency violations',d.summary.sovereignty_violations]];document.getElementById('cards').innerHTML=fields.map(x=>`<div class='card'><b>${x[0]}</b><h2>${x[1]}</h2></div>`).join('');document.getElementById('checks').innerHTML=d.checks.map(x=>`<tr><td>${x.check_id}</td><td class='${x.status.toLowerCase()}'>${x.status}</td><td>${x.evidence}</td></tr>`).join('');</script></main></body></html>
