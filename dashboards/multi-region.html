<!doctype html><html><head><meta charset='utf-8'><title>OpenSat v2.8</title>
<style>body{font-family:Arial;background:#0b1220;color:#edf3ff;margin:0}main{max-width:1180px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#172238;border:1px solid #31445f;border-radius:12px;padding:16px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #31445f;text-align:left}.pass{color:#70e1a1}.fail{color:#ff7b7b}img{width:100%;border-radius:10px;background:white}</style></head><body><main>
<h1>OpenSat Mission Lab v2.8</h1><p>Multi-region active-active routing, replication, failover, and sustainable workload placement.</p>
<div class='grid' id='cards'></div><h2>Validation</h2><table><thead><tr><th>ID</th><th>Status</th><th>Evidence</th></tr></thead><tbody id='checks'></tbody></table>
<h2>Evidence</h2><div class='grid'><div class='card'><img src='region_health.png'></div><div class='card'><img src='traffic_distribution.png'></div><div class='card'><img src='replication_lag.png'></div><div class='card'><img src='cost_carbon_tradeoff.png'></div></div>
<script>const d={"summary": {"version": "2.8.0", "status": "PASS", "checks_passed": 18, "checks_total": 18, "region_count": 3, "request_count": 2626, "completed_jobs": 2626, "failover_count": 2, "maximum_rpo_records": 0, "maximum_rto_minutes": 0, "peak_replication_lag_seconds": 8.5, "peak_regional_queue": 9, "peak_region_workers": 4, "final_queue_depth": 0, "total_cost_usd": 2.4113333333333333, "total_carbon_gco2e": 904.1375, "final_health": "HEALTHY"}, "checks": [{"check_id": "MR-001", "status": "PASS", "evidence": "Three active regions are configured"}, {"check_id": "MR-002", "status": "PASS", "evidence": "No request is routed to the failed Bengaluru region"}, {"check_id": "MR-003", "status": "PASS", "evidence": "Regional outage produces explicit failover decisions"}, {"check_id": "MR-004", "status": "PASS", "evidence": "Every regional failover exercise recovers"}, {"check_id": "DATA-001", "status": "PASS", "evidence": "Replication partition is detected"}, {"check_id": "DATA-002", "status": "PASS", "evidence": "Replication lag recovers after the partition"}, {"check_id": "DATA-003", "status": "PASS", "evidence": "Demonstration reports zero acknowledged-record loss"}, {"check_id": "ROUTE-001", "status": "PASS", "evidence": "Every request identifier is unique"}, {"check_id": "ROUTE-002", "status": "PASS", "evidence": "Every generated request is accepted exactly once"}, {"check_id": "ROUTE-003", "status": "PASS", "evidence": "Every accepted request completes"}, {"check_id": "OPS-001", "status": "PASS", "evidence": "All regional queues drain to zero"}, {"check_id": "OPS-002", "status": "PASS", "evidence": "Regional backlog remains bounded"}, {"check_id": "OPS-003", "status": "PASS", "evidence": "Regional workers respect configured maximums"}, {"check_id": "SUST-001", "status": "PASS", "evidence": "Carbon-flexible batch workloads choose the cleanest region"}, {"check_id": "SUST-002", "status": "PASS", "evidence": "Latency-sensitive Indian workloads choose Bengaluru when healthy"}, {"check_id": "SUST-003", "status": "PASS", "evidence": "Carbon impact is quantified"}, {"check_id": "FIN-001", "status": "PASS", "evidence": "Regional operating cost is quantified"}, {"check_id": "FINAL-001", "status": "PASS", "evidence": "All regions finish healthy"}]};const fields=[['Status',d.summary.status],['Checks',d.summary.checks_passed+' / '+d.summary.checks_total],['Requests',d.summary.request_count],['Completed',d.summary.completed_jobs],['Failovers',d.summary.failover_count],['Peak regional queue',d.summary.peak_regional_queue],['Cost',d.summary.total_cost_usd.toFixed(3)+' USD'],['Carbon',d.summary.total_carbon_gco2e.toFixed(1)+' gCO₂e']];document.getElementById('cards').innerHTML=fields.map(x=>`<div class='card'><b>${x[0]}</b><h2>${x[1]}</h2></div>`).join('');document.getElementById('checks').innerHTML=d.checks.map(x=>`<tr><td>${x.check_id}</td><td class='${x.status.toLowerCase()}'>${x.status}</td><td>${x.evidence}</td></tr>`).join('');</script></main></body></html>
