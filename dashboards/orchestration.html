<!doctype html><html><head><meta charset='utf-8'><title>OpenSat v3.0</title>
<style>body{font-family:Arial;background:#07131f;color:#edf6ff;margin:0}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#13283c;border:1px solid #31516d;border-radius:12px;padding:16px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #31516d;text-align:left}.pass{color:#74e6a4}.fail{color:#ff8585}img{width:100%;border-radius:10px;background:white}</style></head><body><main>
<h1>OpenSat Mission Lab v3.0</h1><p>Policy-governed mission orchestration, human approvals, durable replay, compensation, and audit evidence.</p>
<div class='grid' id='cards'></div><h2>Validation</h2><table><thead><tr><th>ID</th><th>Status</th><th>Evidence</th></tr></thead><tbody id='checks'></tbody></table>
<h2>Evidence</h2><div class='grid'><div class='card'><img src='workflow_dag.png'></div><div class='card'><img src='workflow_execution_timeline.png'></div><div class='card'><img src='approval_latency.png'></div><div class='card'><img src='compensation_recovery.png'></div></div>
<script>const d={"summary": {"version": "3.0.0", "status": "PASS", "checks_passed": 22, "checks_total": 22, "workflow_runs": 3, "completed_runs": 2, "compensated_runs": 1, "deduplicated_triggers": 1, "task_executions": 22, "approval_decisions": 5, "maximum_approval_latency_minutes": 2.5, "retry_count": 2, "compensation_actions": 1, "event_count": 64, "replayed_runs": 3, "final_state": "HEALTHY"}, "checks": [{"check_id": "V30-001", "status": "PASS", "evidence": "workflow DAG is acyclic and dependency complete"}, {"check_id": "V30-002", "status": "PASS", "evidence": "3 unique workflow runs"}, {"check_id": "V30-003", "status": "PASS", "evidence": "duplicate trigger suppressed by idempotency key"}, {"check_id": "V30-004", "status": "PASS", "evidence": "all workflow runs have idempotency keys"}, {"check_id": "V30-005", "status": "PASS", "evidence": "all task executions have idempotency keys"}, {"check_id": "V30-006", "status": "PASS", "evidence": "64 event records form a valid SHA-256 chain"}, {"check_id": "V30-007", "status": "PASS", "evidence": "event replay reconstructs every terminal state"}, {"check_id": "V30-008", "status": "PASS", "evidence": "all human decisions met five-minute latency policy"}, {"check_id": "V30-009", "status": "PASS", "evidence": "human rejection path exercised"}, {"check_id": "V30-010", "status": "PASS", "evidence": "all required compensations completed"}, {"check_id": "V30-011", "status": "PASS", "evidence": "safe compensated terminal path exercised"}, {"check_id": "V30-012", "status": "PASS", "evidence": "successful workflows publish validated products"}, {"check_id": "V30-013", "status": "PASS", "evidence": "two bounded transient retries exercised"}, {"check_id": "V30-014", "status": "PASS", "evidence": "task attempts remained below maximum policy"}, {"check_id": "V30-015", "status": "PASS", "evidence": "dependency outage pause recorded"}, {"check_id": "V30-016", "status": "PASS", "evidence": "paused workflow resumed from durable history"}, {"check_id": "V30-017", "status": "PASS", "evidence": "four explicit approvals recorded"}, {"check_id": "V30-018", "status": "PASS", "evidence": "retries reused stable task idempotency keys"}, {"check_id": "V30-019", "status": "PASS", "evidence": "all workflow durations are non-negative"}, {"check_id": "V30-020", "status": "PASS", "evidence": "all runs reached approved terminal states"}, {"check_id": "V30-021", "status": "PASS", "evidence": "every run appears in replay evidence"}, {"check_id": "V30-022", "status": "PASS", "evidence": "event payloads contain no credential material"}]};const f=[['Status',d.summary.status],['Checks',d.summary.checks_passed+' / '+d.summary.checks_total],['Workflow runs',d.summary.workflow_runs],['Completed',d.summary.completed_runs],['Compensated',d.summary.compensated_runs],['Approvals',d.summary.approval_decisions],['Retries',d.summary.retry_count],['Audit events',d.summary.event_count]];document.getElementById('cards').innerHTML=f.map(x=>`<div class='card'><b>${x[0]}</b><h2>${x[1]}</h2></div>`).join('');document.getElementById('checks').innerHTML=d.checks.map(x=>`<tr><td>${x.check_id}</td><td class='${x.status.toLowerCase()}'>${x.status}</td><td>${x.evidence}</td></tr>`).join('');</script></main></body></html>
